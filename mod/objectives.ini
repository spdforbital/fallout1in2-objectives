; Fallout 1in2 Objectives - settings
; Most of these can also be changed in game: press O, then 3 (Settings page).

[Panel]
; 1 = show the quest panel on the right edge of the map screen
Enabled=1
; width in pixels; X=-1 puts the panel at the right edge, otherwise distance from the left
Width=300
X=-1
Y=6
; number of optional quests shown (tracked one first, then the nearest)
OptionalQuests=3
; open steps shown per quest
StepsPerQuest=2
; show the last finished step of each quest with an X
ShowDoneStep=1
; 1 = dark box behind the text, 0 = text only (with shadow)
Background=1
; 1 = hide the panel while the mouse is over it, so you can click the map underneath
HideOnHover=1
; game font: 100 small, 101 normal, 102, 103
Font=101
; GEAR line (nearest better weapon/armor on the map)
ShowGear=1
; water chip days left (later: Vault 13 invasion estimate)
ShowTimer=1
ShowInCombat=1
; recompute every N frames
RefreshFrames=15

[Highlight]
; outlines on the map, no Motion Sensor needed
Enabled=1
QuestItems=1
BetterGear=1
; also outline containers holding quest items / better gear
Containers=0
; colours: 1 glowing red, 2 red, 4 grey, 8 glowing green, 16 yellow, 32 dark yellow, 64 purple
QuestColor=16
GearColor=8
; an item counts as better when its score is this many percent above what you use
BetterByPercent=10

[Keys]
; DirectX scan codes: 24 = O. 0 = no key
Objectives=24
TogglePanel=0

[Tab]
; 1 = Quests page shows every quest as a tree (locked / not started / active / done),
; 0 = only active quests plus a finished list
AllQuests=1

[Markers]
; outline the people / objects your current quest steps point at
OutlineTargets=1
; arrow + distance at the screen edge for quest targets that are off screen
EdgeArrows=1
; outline colour for those targets (same codes as above; 64 = purple)
TargetColor=64
